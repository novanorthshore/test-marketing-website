[build]
  publish = "."
  functions = "netlify/functions"

# Sheet tab names are not secrets; their values appear in public files.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_APPLICATIONS_SHEET_TAB,GOOGLE_FINALE_APPLICATIONS_SHEET_TAB"
  NODE_OPTIONS = "--disable-warning=DEP0040"

[functions]
  node_bundler = "esbuild"

[functions."submit-votes"]
  timeout = 26

[functions."send-vote-code"]
  timeout = 26

[functions."process-approvals"]
  schedule = "@yearly"

[functions."process-event-info"]
  schedule = "@yearly"
  included_files = ["assets/event_info.png"]
  timeout = 60

# The Marketplace is temporarily unavailable. Its listing and payment code remain
# in place so it can be restored ahead of the event.
[[redirects]]
  from = "/finale-marketplace.html"
  to = "/finale-event.html"
  status = 302
  force = true

[[redirects]]
  from = "/block-party-voting.html"
  to = "/finale-voting.html"
  status = 301
  force = true
