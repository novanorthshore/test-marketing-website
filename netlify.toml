[build]
  publish = "."
  functions = "netlify/functions"

# Sheet tab names are not secrets; their values appear in public files.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_APPLICATIONS_SHEET_TAB,GOOGLE_VOTES_SHEET_TAB"
  NODE_OPTIONS = "--disable-warning=DEP0040"

[functions]
  node_bundler = "esbuild"

[functions."process-approvals"]
  schedule = "@yearly"

[functions."process-event-info"]
  schedule = "@yearly"
  included_files = ["assets/event_info.png"]
  timeout = 60
